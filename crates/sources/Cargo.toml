[package]
name = "gridwatch-sources"
description = "gridwatch data sources and the source supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gridwatch-store.workspace = true
gridwatch-ui.workspace = true
procfs = { workspace = true, optional = true }
nvml-wrapper = { workspace = true, optional = true }
astral-watch = { workspace = true, optional = true }
realfft = { workspace = true, optional = true }
rtrb = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ebur128 = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
image = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true

[features]
# One feature per source (WORKSPACE.md §15, D47 seam 5): a feature arrives with
# its module.
default = ["cpu", "gpu", "pins"]
cpu = ["dep:procfs"]
gpu = ["dep:nvml-wrapper"]
pins = ["dep:astral-watch"]
audio = ["dep:realfft", "dep:rtrb", "dep:serde_json"]
audio-lufs = ["audio", "dep:ebur128"]
sensors = []
mpris = [
    "dep:zbus",
    "dep:tokio",
    "dep:image",
    "dep:ureq",
    "dep:serde_json",
    "dep:futures-lite",
    "dep:serde",
]
