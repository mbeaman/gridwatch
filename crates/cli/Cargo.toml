[package]
name = "gridwatch"
description = "A modular, themeable ops dashboard for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gridwatch"
path = "src/main.rs"

[dependencies]
gridwatch-app = { workspace = true }
gridwatch-store.workspace = true
gridwatch-ui.workspace = true
gridwatch-sources = { workspace = true }
gridwatch-components = { workspace = true }
clap.workspace = true
color-eyre.workspace = true

[features]
# One feature per source/component pair (WORKSPACE.md §15, D47 seam 5). CI's
# matrix checks none, each alone, and all.
default = ["cpu", "gpu"]
cpu = ["gridwatch-app/cpu"]
gpu = ["gridwatch-app/gpu"]
