[package]
name = "gridwatch-components"
description = "gridwatch built-in components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gridwatch-store.workspace = true
gridwatch-ui.workspace = true
ratatui-core.workspace = true
serde.workspace = true
toml.workspace = true

[features]
# One feature per component (WORKSPACE.md §15, D47 seam 5); `clock` and
# `sources` are always built. `gpu` is declared now, its module lands in 2b.
default = ["htop", "gpu", "pins", "audio"]
htop = []
gpu = []
pins = []
audio = []

[dev-dependencies]
gridwatch-ui = { workspace = true, features = ["testkit"] }
insta.workspace = true
serde_json.workspace = true
