# gridwatch default config.toml (§9). Copied to ~/.config/gridwatch/config.toml
# by `gridwatch config default`.
schema = 1
theme = "retrowave"           # retrowave | modern | mono | terminal | phosphor-green | <file.toml>
fps = 30
fps_max = 60
color = "auto"                # auto | always | never | 16 | 256 | truecolor
mouse = true
readonly = false
confirm_kill = true

[store]
history = "10m"
max_mb = 32

[effects]
enabled = true
budget_ms = 4

[perf]
unfocused_fps = 2
phase_ms = 250

[sources.cpu]
refresh_ms = 1500

[[components]]
id = "cpu"
kind = "htop"

[[components]]
id = "gpu"
kind = "gpu"

[[components]]
id = "pins"
kind = "pins"

[[components]]
id = "lan"
kind = "net"

[[components]]
id = "viz"
kind = "audio"

[[components]]
id = "amp"
kind = "winamp"

[[components]]
id = "temps"
kind = "sensors"

# ---------------------------------------------------------------------------
# Alert rules (§9, arc 7b). Each `[[rules]]` entry watches one metric and
# raises through the same path a source's own alert takes: the banner, the
# alerts tile, `a` to acknowledge, `A` for the panel.
#
#   key       a metric name from `gridwatch keys`, optionally with a label
#             glob in braces — `sensor.temp_c{nvme*:Composite}` is one rule
#             for every drive, and raises one alert per drive.
#   op        > >= < <= == != , or `absent` (the key stopped arriving).
#   value     a number, or another metric read at the same label — a drive
#             compared against its own `sensor.crit_c` needs no hard-coding.
#   for_s     how long it must hold before raising. An `absent` rule
#             requires one: it says how long the key may be missing, and a
#             rule without it would be true from the first frame. clear_s
#             defaults to for_s, and an `absent` rule resolves as soon as
#             its key comes back.
#   message   {key} {label} {value} {threshold} {op} are substituted.
#
# `gridwatch config check` parses these and names any that are wrong; a rule
# that does not parse is skipped, never guessed at.
#
# Two things worth knowing. A threshold rule changes state only when a
# sample arrives, so one that is raised when its source dies stays raised
# until the source returns — the tile's STALE badge is what tells you the
# data stopped. And an `absent` rule whose label is a pattern can only fire
# for a label that has been seen at least once; name the label exactly
# (`net.rx_bps{eno1}`) to catch a key that never arrives at all.
#
# The examples below are torch's, commented out — uncomment what you want.
#
# [[rules]]
# name = "gpu hot"
# key = "gpu.temp_c"
# op = ">"
# value = 84
# for_s = 30
# clear_s = 60
# severity = "warn"
# message = "the gpu has been at {value}°C for half a minute"
#
# [[rules]]
# name = "drive over its own limit"
# key = "sensor.temp_c{nvme*:Composite}"
# op = ">="
# value = "sensor.crit_c"
# for_s = 10
# severity = "crit"
#
# [[rules]]
# name = "link down"
# key = "net.rx_bps{eno1}"
# op = "absent"
# for_s = 15
# severity = "warn"
# message = "eno1 has published nothing for fifteen seconds"
#
# [[rules]]
# name = "swap in use"
# key = "swap.used_b"
# op = ">"
# value = 1073741824
# for_s = 60
# severity = "info"
# message = "swap is {value} bytes — something is over memory"
