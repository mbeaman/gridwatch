[package]
name = "gridwatch-app"
description = "gridwatch application shell: terminal lifecycle, event loop, config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gridwatch-store.workspace = true
gridwatch-ui.workspace = true
gridwatch-sources = { workspace = true }
gridwatch-components = { workspace = true }
ratatui.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tachyonfx.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[features]
# Forwarded to the bin (WORKSPACE.md §15, D47 seam 5).
default = ["cpu", "gpu", "pins", "audio", "sensors", "mpris"]
cpu = ["gridwatch-sources/cpu", "gridwatch-components/htop"]
gpu = ["gridwatch-sources/gpu", "gridwatch-components/gpu"]
pins = ["gridwatch-sources/pins", "gridwatch-components/pins"]
audio = ["gridwatch-sources/audio", "gridwatch-components/audio"]
audio-lufs = ["audio", "gridwatch-sources/audio-lufs"]
sensors = ["gridwatch-sources/sensors", "gridwatch-components/sensors"]
mpris = ["gridwatch-sources/mpris", "gridwatch-components/mpris"]

[dev-dependencies]
proptest.workspace = true
