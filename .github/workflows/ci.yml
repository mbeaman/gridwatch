name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Doc warnings
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build (release)
        run: cargo build --release --locked

  msrv:
    name: MSRV (1.88, all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked --all-features

  per-crate:
    name: Per-crate check (no feature unification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p gridwatch-store
      - run: cargo check -p gridwatch-ui

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p gridwatch --no-default-features
      - run: cargo check -p gridwatch --no-default-features --features cpu
      - run: cargo check -p gridwatch --no-default-features --features gpu
      - run: cargo check -p gridwatch --no-default-features --features pins
      - run: cargo check -p gridwatch --all-features

  docs:
    name: Generated docs and screenshots (D33 drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Regenerate docs/img/*.svg, docs/KEYS.md, docs/COMPONENTS.md and fail on drift
        run: GRIDWATCH_BIN=target/release/gridwatch scripts/shots.sh --check
      - name: Third-party licences are current
        run: scripts/third-party.sh --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
      - name: Duplicate ratatui-core / crossterm guard
        run: |
          cargo tree -d -p gridwatch 2>/dev/null | tee /tmp/dups.txt
          ! grep -E "^(ratatui-core|crossterm) " /tmp/dups.txt

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  schemas:
    name: Schema fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `referencing` is what resolves exec.schema.json's $refs to the
      # manifest and view schemas (arc 8b).
      # `registry=` needs jsonschema 4.18+, where `referencing` replaced
      # the deprecated RefResolver; the runner's default can be older.
      - run: pip install --upgrade "jsonschema>=4.18" referencing
      - run: python3 scripts/check-schemas.py
