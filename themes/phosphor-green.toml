# gridwatch built-in theme: phosphor-green — one P1-phosphor hue on a near
# black, roles as luminance steps (D52). Inherits `mono`'s glyph, border,
# title and widget tables and overrides only the paint.
[meta]
name = "phosphor-green"
schema = 1
variant = "dark"
inherits = "mono"

[palette]
void = "#0a0f0a"
deep = "#0d160e"
ember = "#143d1c"
moss = "#1f7a33"
leaf = "#2e8b3a"
bright = "#00c933"
neon = "#00ff41"
mint = "#7dffa6"
paper = "#b6ffc9"
amber = "#e0c341"
pill = "#ff5a3c"

[colors]
bg = "$void"
surface = "$void"
panel = "$deep"
border = "$moss"
border_focused = "$neon"
title = "$mint"
text = "$paper"
text_muted = "$leaf"
text_ghost = "$ember"
cursor = "$neon"

[colors.accent]
primary = "$neon"
secondary = "$mint"
tertiary = "$bright"

[colors.severity]
ok = "$neon"
warn = "$amber"
crit = "$pill"
info = "$mint"

[colors.selection]
fg = "$void"
bg = "$neon"

# Every ramp starts at $moss (3.6:1 on $void): a low bar must not sit at the
# empty track's own level ($ember is text_ghost — review).
[gradients]
load = ["$moss", "$leaf", "$bright", "$neon", "$mint"]
temp = ["$moss", "$bright", "$neon", "$amber", "$pill"]
power = ["$moss", "$bright", "$neon", "$mint"]
mem = ["$moss", "$leaf", "$neon"]
netrx = ["$moss", "$neon"]
nettx = ["$leaf", "$mint"]
audio = ["$moss", "$leaf", "$bright", "$neon", "$mint", "$paper"]
title = ["$paper", "$mint", "$neon"]

[borders]
set = "plain"
focused_set = "double"
