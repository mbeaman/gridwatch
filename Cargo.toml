[workspace]
members = ["crates/store", "crates/ui", "crates/sources", "crates/components", "crates/app", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mbeaman/gridwatch"

[workspace.dependencies]
gridwatch-store = { path = "crates/store" }
gridwatch-ui = { path = "crates/ui" }
# default-features = false at the root so `gridwatch-app` and the bin can
# forward per-source/per-component features (WORKSPACE.md §15, D47 seam 5).
gridwatch-sources = { path = "crates/sources", default-features = false }
gridwatch-components = { path = "crates/components", default-features = false }
gridwatch-app = { path = "crates/app", default-features = false }
# TUI
ratatui          = { version = "0.30.2", features = ["serde", "palette"] }        # app + cli only
ratatui-core     = { version = "0.1.2", features = ["std", "serde", "underline-color", "layout-cache"] }   # ui, components (default = [] upstream)
ratatui-widgets  = { version = "0.3.2", default-features = false, features = ["std", "serde"] }            # ui, components (drops the calendar/time dep)
crossterm        = { version = "0.29.0", features = ["serde"] }                   # app + cli only
tui-big-text     = "0.8.9"
tachyonfx        = { version = "0.25.1", default-features = false, features = ["std", "sendable"] }   # app only: the effects painter (arc 4b, D54 seam 6); no DSL
unicode-width    = "0.2.2"
# data / config
serde            = { version = "1", features = ["derive", "rc"] }
serde_json       = "1"
toml             = "1.1.4"
toml_edit        = "0.25.13"                                          # app only: the comment-preserving layout.toml save (arc 4a, D54)
palette          = { version = "0.7.7", features = ["std"] }
smallvec         = "1.15"
color-eyre       = "0.6.5"
clap             = { version = "4.6.6", features = ["derive"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc             = "0.2"
procfs           = { version = "0.18.0", default-features = false }   # sources only (D17): htop formulas, no chrono/flate2
nvml-wrapper     = "0.12.1"                                          # sources only, feature gpu (dlopens libnvidia-ml.so.1)
realfft          = "3.5"                                             # sources only, feature audio (D55 seam 2): the cava-style spectrum
rtrb             = "0.4"                                             # sources only, feature audio: the io→dsp SPSC ring
ebur128          = "0.1.10"                                          # sources only, feature audio-lufs
zbus             = { version = "5.19.0", default-features = false, features = ["tokio"] }   # sources only, feature mpris (D17: never the `mpris` crate/libdbus)
tokio            = { version = "1.53", features = ["rt", "sync", "time", "macros"] }        # sources only, behind mpris
image            = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }  # sources only, feature mpris (album art)
ureq             = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }        # sources only, feature mpris (https art)
futures-lite     = { version = "2.6", default-features = false, features = ["std"] }        # sources only, feature mpris: the stream adapter zbus's own API returns
astral-watch     = { git = "https://github.com/mbeaman/astral-watch", rev = "dce7eee77676268c66b3624c7a2870ed9d84eb9c", default-features = false }   # sources only, feature pins (D50 §1: pinned rev, v0.8.0 not required)
# dev
insta            = { version = "1.48", features = ["yaml"] }
proptest         = "1.11"

[profile.release]
lto = true
strip = true
